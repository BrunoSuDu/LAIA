name: Test, Build, and Push Docker Image
on:
  push:
    branches: [ "main" ]
  pull_request:
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Train model
        run: python train.py
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model_data/model.pkl # 👈 the file your training script creates
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: model_data # 👈 downloads model.pkl into model_data/
      - name: Run Flask tests
        run: pytest -v
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: model_data # 👈 downloads model.pkl into model_data/
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/solays/laia_pl_repo/ml-flask-app:latest
